soft_404_warning:
  host: https://linzumi.com
  behaviour: >-
    The marketing host returns HTTP 200 with an identical 404 HTML body for every unknown path,
    including /.well-known/*, /openapi.json, /agents.md, /privacy, and /terms. Status codes from
    linzumi.com are therefore NOT a reliable existence signal — body comparison is required. The API
    host serve.linzumi.com behaves correctly, returning genuine 404 with a JSON error envelope.
  see: well-known/linzumi-well-known.yml
