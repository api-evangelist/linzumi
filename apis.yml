apis:
- aid: linzumi:runner-api
  name: Linzumi Runner API
  description: >-
    The private product API behind the Linzumi web workspace and the local Commander runner, served
    from serve.linzumi.com under a /api/v2 URI-versioned path. It is not a published developer API —
    there is no portal, reference, or OpenAPI — but it is partially observable through the publicly
    published @linzumi/cli client, which documents the device-authorization endpoint and speaks
    WebSocket to wss://serve.linzumi.com for runner traffic. Captured here as an observed surface,
    not a supported public contract.
  humanURL: https://www.npmjs.com/package/@linzumi/cli
