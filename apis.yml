aid: linzumi
name: Linzumi
description: >-
  Linzumi is a Y Combinator (Spring 2026) company in San Francisco building a Slack-shaped team chat
  that runs a fleet of AI coding agents inside every channel. Engineering teams kick off work, watch
  agent activity in real time, review output, and ship code without leaving the thread. Unlike
  sandboxed cloud agent products, Linzumi runs agents on the developer's own machine through a local
  "Commander" runner installed from the @linzumi/cli npm package, so agents work against real
  environment variables, dotfiles, and branches inside explicitly trusted folders. The product adds a
  decision inbox that surfaces only the choices needing a human, continuously compiled team context,
  git safety snapshots taken before each agent turn, and a bundled local MCP server that lets coding
  agents read scoped Linzumi message, thread, and channel context. It supports OpenAI Codex today
  with Claude Code announced as coming soon. The service is in beta via a macOS desktop app and a web
  workspace; there is no public developer API program, documentation portal, or published OpenAPI at
  this time.
